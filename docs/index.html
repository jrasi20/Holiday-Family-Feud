<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050f22">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bible Showdown">
  <meta name="description" content="A Christmas Bible game-show party game for families, churches and small groups.">
  <title>Christmas Bible Survey Showdown</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="icon" href="./assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Inter:wght@500;600;700;800;900&family=Oswald:wght@500;600;700&display=swap">
  <link rel="preload" as="image" href="./assets/cover.jpg">
  <link rel="preload" as="image" href="./assets/logo-title.webp">
  <link rel="stylesheet" href="./css/tv.css?v=10">
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js" defer></script>
</head>
<body data-screen="cover">
  <!-- full-window cover (outside the 16:9 stage so it fills any screen) -->
  <main id="cover" class="cover" data-act="enterGame">
    <div class="cover-blur"></div>
    <img class="cover-art" src="assets/cover.jpg" alt="Christmas Bible Survey Showdown">
    <div class="cover-wide"></div>
    <div class="cover-title"><img src="assets/logo-title.webp" alt=""></div>
    <img class="brand-badge" src="assets/brand-logo.webp" alt="Bible Explorer Kids">
    <div class="cover-cta">
      <button class="btn gold xl pulse" data-act="enterGame"><i class="ico"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg></i> Tap to Begin</button>
      <small><i class="ico"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/></svg></i> Sound turns on when you tap</small>
    </div>
    <footer class="cover-foot">© Bible Explorer Kids · Short Scripture phrases from the Holy Bible, NIV®. © 2011 Biblica, Inc.™ Used by permission. All rights reserved worldwide.</footer>
  </main>

  <!-- 1600x900 broadcast stage, scaled to fit -->
  <div id="viewport"><div id="stage"><div id="scene-root"></div><div id="card-layer"></div></div></div>
  <div id="rotate-hint"><div class="rot-phone"></div><b>Turn your phone sideways</b><small>or cast this screen to your TV</small></div>

  <noscript><p style="color:#fff;text-align:center;padding:2rem">Please enable JavaScript to play.</p></noscript>
  <script type="module" src="./js/app.js?v=10"></script>
</body>
</html>
